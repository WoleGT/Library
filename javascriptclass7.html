 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">

 </head>
 <body>
   <h2>What Can JavaScript Do?</h2>

   <p>JavaScript can change HTML attribute values.</p>
   
   <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>
   
   <button onclick="document.getElementById('myImage').src='pic_bulbon.gifhttps://images.app.goo.gl/3Gtc1rc8pL6R9BaS9'">Turn on the light</button>
   
   <img id="myImage" src=https://images.app.goo.gl/3Gtc1rc8pL6R9BaS9" style="width:100px">
   
   <button onclick="document.getElementById('myImage').src='https://images.app.goo.gl/3Gtc1rc8pL6R9BaS9'">Turn off the light</button>
   
 </body>
 </html>
